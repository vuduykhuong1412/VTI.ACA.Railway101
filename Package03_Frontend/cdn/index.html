<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div>
        <h1 id="title">Hello, World!</h1>
        <p class="message">This is a simple paragraph.</p>
        <ul>
            <li class="list-item">Item 1</li>
            <li class="list-item">Item 2</li>
            <li class="list-item">Item 3</li>
        </ul>
    </div>


    <div>
        <form id="form-submit" class="form-submit">
            <div class="form-title">
                <label for="title">Title:</label>
                <input type="text" id="title" title="title" required>
            </div>

            <div class="form-body">
                <label for="body">Body:</label>
                <input type="text" id="body" name="body" required>
            </div>

            <button class="btn-submit" type="submit">Submit</button>
        </form>
    </div>

    <div class="info">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        $('#title').css('color', 'blue');
        $('.message').text('This text has been changed using jQuery.');
        $('.message').hasClass('message') ? console.log('The paragraph has the class "message".') : console.log('The paragraph does not have the class "message".');

        $('.list-item').each(function (index) {
            $(this).text('Updated Item ' + (index + 1));
        });

        $('.list-item').css({
            'font-weight': '450',
            'cursor': 'pointer'
        });
        $('.list-item').click(function () {
            $(this).toggleClass('selected');
        });
    </script>

    <script>
        $.ajax({
            url: "https://jsonplaceholder.typicode.com/posts/1",
            type: "GET",
            dataType: "json",
            success: function (data) {
                console.log(data);
                $('.info').append('<h2>' + data.title + '</h2>');
                $('.info').append('<p>' + data.body + '</p>');

                $('.info').css({
                    'border': '1px solid #ccc',
                    'padding': '10px',
                    'margin-top': '20px'
                });

                $('.info h2').css({
                    'color': 'green',
                    'font-size': '20px'
                });

                $('.info p').css({
                    'color': 'gray',
                    'font-size': '16px'
                });
            },
            error: function (error) {
                console.error("Lỗi:", error);
            }
        });
    </script>

</body>

</html>
